<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movistar Estudiantes · Temporada 2026-27</title>
<style>
:root{--bg:#0b1220;--card:#131c30;--tx:#e8edf7;--mu:#8fa0bf;--ac:#ffb81c;--bl:#2f6bff;--w:#2ecc71;--l:#ff5c5c;--bd:#22304d}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fa;--card:#fff;--tx:#0b1220;--mu:#5b6b88;--bd:#dde3ef}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:20px 16px 8px}h1{margin:0;font-size:22px}h1 span{color:var(--ac)}.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:var(--card);color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;white-space:nowrap;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
main{padding:8px 16px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k{font-size:26px;font-weight:700}.lb{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd)}th:nth-child(2),td:nth-child(2){text-align:left}
tr.me{background:rgba(255,184,28,.15);font-weight:600}.wrap{overflow-x:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.b{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;color:#111}.W{background:var(--w)}.L{background:var(--l)}
.empty{color:var(--mu);text-align:center;padding:24px}a{color:var(--bl);text-decoration:none}ul{padding-left:18px;margin:6px 0}
</style></head><body>
<header><h1>Movistar <span>Estudiantes</span></h1><div class="sub" id="sub"></div></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const tabs=[['res','Resumen'],['cal','Calendario'],['cla','Clasificación'],['pla','Plantilla'],['not','Noticias']];
let D,N=[],tab='res';
const played=()=>D.fixtures.filter(f=>f.ptsFor!=null).sort((a,b)=>new Date(a.date)-new Date(b.date));
const nextG=()=>D.fixtures.filter(f=>f.ptsFor==null&&new Date(f.date)>new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
const res=f=>f.ptsFor>f.ptsAgainst?'W':'L';
const empty=t=>`<div class="card empty">${t}</div>`;
const V={
res(){const p=played(),w=p.filter(f=>res(f)=='W').length,pf=p.reduce((a,f)=>a+f.ptsFor,0),pc=p.reduce((a,f)=>a+f.ptsAgainst,0),n=nextG(),c=D.club;
 const form=p.slice(-5).map(f=>`<span class="b ${res(f)}">${res(f)=='W'?'V':'D'}</span>`).join(' ')||'—';
 return `<div class="card"><div class="lb">Lema ${D.season}</div><div class="k" style="color:var(--ac)">${esc(D.motto)}</div><div>${esc(c.competition)} · ${esc(c.goal)}</div><div class="sub">Entrenador: ${esc(c.coach)} · ${esc(c.arena)}</div></div>
 <div class="grid"><div class="card"><div class="k">${w}-${p.length-w}</div><div class="lb">Balance</div></div><div class="card"><div class="k">${p.length?(pf/p.length).toFixed(1):'—'}</div><div class="lb">Puntos a favor</div></div><div class="card"><div class="k">${p.length?(pc/p.length).toFixed(1):'—'}</div><div class="lb">Puntos en contra</div></div><div class="card"><div class="k">${p.length?pf-pc:'—'}</div><div class="lb">Diferencial</div></div></div>
 <div class="card"><div class="lb">Racha (últimos 5)</div>${form}</div>
 <div class="card"><div class="lb">Próximo partido</div>${n?`<b>${n.home?'vs':'@'} ${esc(n.rival)}</b><div class="sub">${fmt(n.date)} · ${esc(n.comp||D.club.competition)}</div>`:'<span class="sub">Sin partido programado en data.json</span>'}</div>
 <div class="card"><div class="lb">Equipos del club</div>${D.teams.map(t=>`<div class="row"><div><b>${esc(t.name)}</b><div class="sub">${esc(t.note)}</div></div><div class="sub">${esc(t.league)}${t.coach?'<br>'+esc(t.coach):''}</div></div>`).join('')}</div>
 <div class="card"><div class="lb">Contexto</div><ul>${D.history.map(h=>`<li>${esc(h)}</li>`).join('')}</ul><div class="sub">${esc(c.shareholder)}</div></div>`},
cal(){if(!D.fixtures.length)return empty('Aún no hay partidos cargados. Añádelos en data.json → fixtures.');
 return `<div class="card">${[...D.fixtures].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(f=>`<div class="row"><div><b>${f.home?'vs':'@'} ${esc(f.rival)}</b><div class="sub">${f.round?'J'+esc(f.round)+' · ':''}${fmt(f.date)} · ${esc(f.comp||'')}</div></div>${f.ptsFor!=null?`<div><b>${f.ptsFor}-${f.ptsAgainst}</b> <span class="b ${res(f)}">${res(f)=='W'?'V':'D'}</span></div>`:'<span class="sub">Pendiente</span>'}</div>`).join('')}</div>`},
cla(){if(!D.standings.length)return empty('Clasificación sin cargar. Añádela en data.json → standings.');
 return `<div class="card wrap"><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>V</th><th>D</th><th>PF</th><th>PC</th></tr>${D.standings.map(s=>`<tr class="${/estudiantes/i.test(s.team)?'me':''}"><td>${s.pos}</td><td>${esc(s.team)}</td><td>${s.pj}</td><td>${s.w}</td><td>${s.l}</td><td>${s.pf}</td><td>${s.pc}</td></tr>`).join('')}</table></div>`},
pla(){if(!D.roster.length)return empty('Plantilla sin cargar. Añádela en data.json → roster.');
 return `<div class="card wrap"><table><tr><th>#</th><th>Jugador</th><th>Pos</th><th>PPP</th><th>REB</th><th>AST</th><th>VAL</th></tr>${D.roster.map(p=>`<tr><td>${esc(p.num)}</td><td>${esc(p.name)}<div class="sub">${esc(p.height||'')} ${p.age?'· '+p.age+' años':''}</div></td><td>${esc(p.pos)}</td><td>${p.ppg??'—'}</td><td>${p.rpg??'—'}</td><td>${p.apg??'—'}</td><td>${p.val??'—'}</td></tr>`).join('')}</table></div>`},
not(){return N.length?`<div class="card">${N.map(n=>`<div class="row"><div><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="sub">${esc(n.source)} · ${n.date?new Date(n.date).toLocaleDateString('es-ES'):''}</div></div></div>`).join('')}</div>`:empty('Cargando noticias…')}};
function ago(t){if(!t)return'sin sincronizar';const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'ahora mismo':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`}
function render(){$('#sub').textContent=`Temporada ${D.season} · ${D.club.competition} · datos ${ago(D.sync?.lastSync)}${D.sync&&!D.sync.ok?' ⚠':''}`;
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" data-k="${k}">${l}</button>`).join('');
 $('#m').innerHTML=V[tab]();}
$('#nav').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;location.hash=k;render()}};
(async()=>{const h=location.hash.slice(1);if(tabs.some(t=>t[0]==h))tab=h;
 D=await (await fetch('/api/data')).json();render();
 try{N=await (await fetch('/api/news')).json()}catch(e){}if(tab=='not')render();
 setInterval(async()=>{try{D=await (await fetch('/api/data')).json();render()}catch(e){}},60000);})();
</script></body></html>
