<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#002c72">
<title>Movistar Estudiantes · 2026-27</title>
<style>
:root{color-scheme:dark;--bg:#060d1f;--c1:#0e1a36;--c2:#15244a;--br:#2a63ff;--ac:#ffc233;--tx:#eef2fb;--mu:#8a9bc0;--bd:#22345e;--w:#2ecc71;--l:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#10337a55,transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;z-index:9;background:#060d1fcc;backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;letter-spacing:.02em}.logo b{color:var(--ac)}.pill{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--w);box-shadow:0 0 8px var(--w)}.dot.x{background:var(--ac);box-shadow:0 0 8px var(--ac)}
main{max-width:860px;margin:auto;padding:12px 16px}
.hero{border-radius:22px;padding:22px 18px;background:linear-gradient(135deg,#0a2a78,#1a46c9 55%,#0b1f55);border:1px solid #3a63d8;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#ffc23366,transparent 70%)}
.hero h1{margin:4px 0 2px;font-size:30px;letter-spacing:.04em;font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#ffffff1f;border:1px solid #ffffff2e}
.cd{display:flex;gap:8px;margin-top:14px}.cd div{background:#00000040;border-radius:12px;padding:8px 0;min-width:58px;text-align:center}.cd b{display:block;font-size:22px}.cd span{font-size:10px;color:#cfe0ff;text-transform:uppercase}
.card{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:20px 4px 6px}.sub{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kp{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:12px}.kp b{font-size:26px;display:block}.kp span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.b{display:inline-block;min-width:24px;text-align:center;border-radius:7px;padding:1px 7px;font-weight:800;color:#06101f}.W{background:var(--w)}.L{background:var(--l)}
.dt{width:46px;text-align:center;background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:4px 0;font-size:11px;color:var(--mu)}.dt b{display:block;font-size:18px;color:var(--tx)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.filters button{border:1px solid var(--bd);background:var(--c1);color:var(--mu);border-radius:99px;padding:7px 13px;white-space:nowrap;font:inherit}.filters button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:620px){.pg{grid-template-columns:repeat(3,1fr)}}
.pc{border-radius:18px;overflow:hidden;background:var(--c1);border:1px solid var(--bd);position:relative;cursor:pointer;transition:.15s}.pc:active{transform:scale(.97)}
.ph{aspect-ratio:3/4;width:100%;object-fit:cover;object-position:top;display:block;background:linear-gradient(160deg,#1a46c9,#0b1f55)}.ini{aspect-ratio:3/4;display:grid;place-items:center;font-size:44px;font-weight:800;background:linear-gradient(160deg,#1a46c9,#0b1f55)}
.num{position:absolute;top:6px;left:10px;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 12px #000}.pi{padding:10px 12px}.pi b{display:block}.pi span{font-size:12px;color:var(--mu)}
.tag{position:absolute;top:10px;right:8px;font-size:10px;padding:2px 8px;border-radius:99px;background:#000a;color:var(--ac);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 5px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:11px;text-transform:uppercase}th:nth-child(2),td:nth-child(2){text-align:left}tr.me{background:#ffc23322;font-weight:700}.wrap{overflow-x:auto}
.mod{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:flex-end}.mod.on{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:var(--c1);border-radius:24px 24px 0 0;border:1px solid var(--bd);max-height:88vh;overflow:auto;padding-bottom:30px}
.sheet .ph,.sheet .ini{aspect-ratio:4/3;object-position:top}.sheet .in{padding:14px 18px}.sheet h3{margin:0;font-size:24px}
.sk{height:64px;border-radius:14px;margin:10px 0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200%;animation:s 1.3s infinite}@keyframes s{to{background-position:-200%}}
.empty{text-align:center;color:var(--mu);padding:18px}.empty big{font-size:34px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#060d1fe8;backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
a{color:#7fa4ff;text-decoration:none}.nw{display:block;padding:12px 0;border-bottom:1px solid var(--bd);color:var(--tx)}.nw:last-child{border:0}
</style></head><body>
<header><div class="logo">MOVISTAR <b>ESTUDIANTES</b></div><div class="pill"><span class="dot x" id="dot"></span><span id="sy">…</span></div></header>
<main id="m"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div class="mod" id="mod" onclick="if(event.target==this)this.classList.remove('on')"><div class="sheet" id="sh"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['ini','🏠','Inicio'],['par','📅','Partidos'],['tab','🏆','Tabla'],['plan','👕','Plantilla'],['not','📰','Noticias']];
const PH='https://www.movistarestudiantes.com/wp-content/uploads/2026/10/Jugadores-web-Primera-FEB-';
let D,N=[],tab='ini',flt='Todos';
const age=b=>Math.floor((Date.now()-new Date(b))/315576e5),ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const fd=d=>new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}),ft=d=>new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const done=()=>D.fixtures.filter(f=>f.ptsFor!=null).sort((a,b)=>new Date(a.date)-new Date(b.date)),next=()=>D.fixtures.filter(f=>f.ptsFor==null&&new Date(f.date)>new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
const R=f=>f.ptsFor>f.ptsAgainst?'W':'L',tm=f=>f.noTime?'':ft(f.date)+' · ',avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const img=p=>`<img class="ph" loading="lazy" src="${PH}${p.ph}.jpg" alt="${ini(p.name)}" onerror="this.outerHTML='<div class=ini>${ini(p.name)}</div>'">`;
const empty=(i,t)=>`<div class="card empty"><big>${i}</big>${t}</div>`;
function cdown(){const n=next();if(!n)return'';const s=Math.max(0,(new Date(n.date)-Date.now())/1e3),u=[['días',86400],['h',3600],['min',60],['s',1]];let r=s;return`<div class="sub" style="margin-top:14px;color:#dbe7ff">Próximo: <b>${n.home?'vs':'@'} ${E(n.rival)}</b> · ${fd(n.date)} ${n.noTime?'':ft(n.date)}</div><div class="cd" id="cd">${u.map(([l,k])=>{const v=Math.floor(r/k);r-=v*k;return`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`}).join('')}</div>`}
const V={
ini(){const p=done(),w=p.filter(f=>R(f)=='W').length,pf=avg(p.map(f=>f.ptsFor)),pc=avg(p.map(f=>f.ptsAgainst)),r=D.roster,c=D.club,st=D.standings.find(s=>/estudiantes/i.test(s.team));
 const tall=[...r].sort((a,b)=>b.height-a.height)[0],old=[...r].sort((a,b)=>new Date(a.born)-new Date(b.born))[0],yng=[...r].sort((a,b)=>new Date(b.born)-new Date(a.born))[0];
 return`<div class="hero"><div class="sub" style="color:#cfe0ff">TEMPORADA ${D.season}</div><h1>${E(D.motto).toUpperCase()}</h1><div>${E(c.goal)}</div><div class="chips"><span class="chip">${E(c.competition)}</span><span class="chip">🏀 ${E(c.coach)}</span><span class="chip">📍 ${E(c.arena)}</span></div>${cdown()}</div>
 <h2>Temporada</h2><div class="grid"><div class="kp"><b>${p.length?w+'-'+(p.length-w):'—'}</b><span>Balance</span></div><div class="kp"><b>${st?st.pos+'º':'—'}</b><span>Clasificación</span></div><div class="kp"><b>${p.length?pf.toFixed(1):'—'}</b><span>Puntos a favor</span></div><div class="kp"><b>${p.length?pc.toFixed(1):'—'}</b><span>Puntos en contra</span></div></div>
 ${p.length?`<div class="card"><div class="sub">Racha</div><div style="margin:6px 0 10px">${p.slice(-8).map(f=>`<span class="b ${R(f)}">${R(f)=='W'?'V':'D'}</span>`).join(' ')}</div>${bars(p.slice(-10))}</div>`:empty('📡','Los resultados aparecerán aquí en cuanto se sincronice el calendario.')}
 <h2>La plantilla en datos</h2><div class="grid"><div class="kp"><b>${r.length}</b><span>Jugadores</span></div><div class="kp"><b>${avg(r.map(x=>age(x.born))).toFixed(1)}</b><span>Edad media</span></div><div class="kp"><b>${(avg(r.map(x=>x.height))).toFixed(2)} m</b><span>Altura media</span></div><div class="kp"><b>${r.filter(x=>/local/i.test(x.status)).length}</b><span>Formados localmente</span></div></div>
 <div class="card"><div class="row"><span>📏 Más alto</span><b>${tall.name} · ${tall.height.toFixed(2)}</b></div><div class="row"><span>🧓 Veterano</span><b>${old.name} · ${age(old.born)} años</b></div><div class="row"><span>🌱 Más joven</span><b>${yng.name} · ${age(yng.born)} años</b></div></div>
 <h2>Club</h2>${D.teams.map(t=>`<div class="card row"><div><b>${E(t.name)}</b><div class="sub">${E(t.note)}</div></div><div class="sub" style="text-align:right">${E(t.league)}<br>${E(t.coach)}</div></div>`).join('')}
 <h2>Contexto</h2><div class="card">${D.history.map(h=>`<div class="row"><span>🏆 ${E(h)}</span></div>`).join('')}<div class="sub" style="margin-top:8px">${E(c.shareholder)}</div></div>`},
par(){if(!D.fixtures.length)return empty('📅','Calendario pendiente de sincronizar.<br><span class="sub">Se actualiza solo cada pocos minutos.</span>')+'<div class="sk"></div><div class="sk"></div>';
 const g={};[...D.fixtures].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(f=>{const k=new Date(f.date).toLocaleDateString('es-ES',{month:'long',year:'numeric'});(g[k]=g[k]||[]).push(f)});
 return Object.entries(g).map(([k,a])=>`<h2>${k}</h2><div class="card">${a.map(f=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="dt"><b>${new Date(f.date).getDate()}</b>${new Date(f.date).toLocaleDateString('es-ES',{weekday:'short'})}</div><div><b>${f.home?'vs':'@'} ${E(f.rival)}</b><div class="sub">${f.round?'J'+E(f.round)+' · ':''}${tm(f)}${f.comp&&f.comp!='Primera FEB'?E(f.comp)+' · ':''}${f.home?'En casa':'Fuera'}</div>${f.top?`<div class="sub">⭐ ${E(f.top)}</div>`:''}${f.note?`<div class="sub">${E(f.note)}</div>`:''}</div></div>${f.ptsFor!=null?`<div style="text-align:right"><b>${f.ptsFor}-${f.ptsAgainst}</b><br><span class="b ${R(f)}">${R(f)=='W'?'V':'D'}</span></div>`:'<span class="sub">'+(new Date(f.date)<new Date()?'Sin resultado':'Pendiente')+'</span>'}</div>`).join('')}</div>`).join('')},
tab(){if(!D.standings.length)return empty('🏆','Sincronizando la clasificación…')+'<div class="sk"></div>';const hp=D.standings.some(s=>s.pf);
 return`<div class="card wrap"><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>V</th><th>D</th>${hp?'<th>PF</th><th>PC</th>':''}<th>Pts</th></tr>${D.standings.map(s=>`<tr class="${/estudiantes/i.test(s.team)?'me':''}"><td>${s.pos}</td><td>${E(s.team)}</td><td>${s.pj}</td><td>${s.w}</td><td>${s.l}</td>${hp?`<td>${s.pf}</td><td>${s.pc}</td>`:''}<td><b>${s.pts??s.w*2}</b></td></tr>`).join('')}</table></div>`},
plan(){const pos=['Todos',...new Set(D.roster.map(p=>p.pos))],l=D.roster.filter(p=>flt=='Todos'||p.pos==flt);
 return`<div class="filters">${pos.map(x=>`<button class="${x==flt?'on':''}" onclick="flt='${x}';draw()">${x}</button>`).join('')}</div><div class="pg">${l.map(p=>`<div class="pc" onclick="open_(${p.num})"><span class="num">${p.num}</span>${/extra|cotonú/i.test(p.status)?`<span class="tag">${/extra/i.test(p.status)?'EXTRA':'COT'}</span>`:''}${img(p)}<div class="pi"><b>${E(p.name)}</b><span>${p.pos} · ${p.height.toFixed(2)} m · ${age(p.born)} años</span></div></div>`).join('')}</div>
 <h2>Cuerpo técnico</h2><div class="card">${D.staff.map(s=>`<div class="row"><b>${E(s[0])}</b><span class="sub">${E(s[1])}</span></div>`).join('')}</div>`},
not(){return N.length?`<div class="card">${N.map(n=>`<a class="nw" href="${E(n.link)}" target="_blank" rel="noopener"><b>${E(n.title)}</b><div class="sub">${E(n.source)} · ${n.date?new Date(n.date).toLocaleDateString('es-ES'):''}</div></a>`).join('')}</div>`:'<div class="sk"></div><div class="sk"></div><div class="sk"></div>'}};
function bars(a){const m=Math.max(...a.flatMap(f=>[f.ptsFor,f.ptsAgainst]),1),w=100/a.length;return`<svg viewBox="0 0 100 40" width="100%" height="110" preserveAspectRatio="none">${a.map((f,i)=>`<rect x="${i*w+w*.1}" y="${40-f.ptsFor/m*38}" width="${w*.38}" height="${f.ptsFor/m*38}" rx=".8" fill="#2a63ff"/><rect x="${i*w+w*.5}" y="${40-f.ptsAgainst/m*38}" width="${w*.38}" height="${f.ptsAgainst/m*38}" rx=".8" fill="#ffc233"/>`).join('')}</svg><div class="sub">🔵 Estudiantes · 🟡 Rival (últimos ${a.length})</div>`}
function open_(n){const p=D.roster.find(x=>x.num==n),has=p.ppg!=null;$('#sh').innerHTML=img(p)+`<div class="in"><div class="sub">#${p.num} · ${p.pos}</div><h3>${E(p.name)}</h3><div class="grid" style="margin-top:12px"><div class="kp"><b>${p.height.toFixed(2)} m</b><span>Altura</span></div><div class="kp"><b>${age(p.born)}</b><span>Años</span></div></div><div class="card row"><span>Nacimiento</span><b>${new Date(p.born).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</b></div><div class="card row"><span>Estatus FEB</span><b>${E(p.status)}</b></div>${(()=>{const k=[['ppg','Puntos'],['rpg','Rebotes'],['apg','Asist.'],['val','Valoración media']].filter(x=>p[x[0]]!=null);return(k.length?`<div class="grid">${k.map(x=>`<div class="kp"><b>${p[x[0]]}</b><span>${x[1]}</span></div>`).join('')}</div>`:'')+((p.hl||[]).length?`<h2>Mejores actuaciones 2026-27</h2><div class="card">${p.hl.map(h=>`<div class="row"><span>${E(h)}</span></div>`).join('')}</div>`:'')})()}</div>`;$('#mod').classList.add('on')}
function draw(){$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';location.hash=tab;draw();scrollTo(0,0)"><i>${i}</i>${l}</button>`).join('');$('#m').innerHTML=V[tab]();const s=D.sync;$('#sy').textContent=s&&s.lastSync?'Datos '+ago(s.lastSync):'Sin sincronizar';$('#dot').className='dot'+(s&&s.ok?'':' x')}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'ahora':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`};
async function load(){try{D=await (await fetch('/api/data')).json();draw()}catch(e){}}
(async()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]==h))tab=h;await load();try{N=await (await fetch('/api/news')).json();if(tab=='not')draw()}catch(e){}setInterval(load,6e4);setInterval(()=>{const n=next();if(n&&$('#cd'))$('#cd').outerHTML=cdown().match(/<div class="cd"[\s\S]*<\/div>(?=$)/)?.[0]||''},1000)})();
</script></body></html>
