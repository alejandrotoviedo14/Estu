 fx.forEach(f=>{const k=new Date(f.date).toLocaleDateString('es-ES',{month:'long',year:'numeric'});(g[k]=g[k]||[]).push(f)});
 return`<h2 class="it">Línea de temporada</h2><div class="tl" id="tl">${fx.map(f=>`<div class="nd ${f.ptsFor!=null?R(f):f===n?'N':''}" onclick="game(${D.fixtures.indexOf(f)})"><div class="ring">${crest(f.rival,34)}</div><small>${f.round?'J'+f.round:E(f.comp.slice(0,6))}</small><b>${f.ptsFor!=null?f.ptsFor+'-'+f.ptsAgainst:new Date(f.date).getDate()+'/'+(new Date(f.date).getMonth()+1)}</b></div>`).join('')}</div>`+
 Object.entries(g).map(([k,a])=>`<h2 class="it">${k}</h2><div class="card">${a.map(f=>`<div class="row" onclick="game(${D.fixtures.indexOf(f)})"><div class="l"><div class="dt"><b>${new Date(f.date).getDate()}</b>${new Date(f.date).toLocaleDateString('es-ES',{weekday:'short'})}</div>${crest(f.rival,38)}<div style="min-width:0"><b>${f.home?'vs':'@'} ${E(f.rival)}</b><div class="sub">${f.round?'J'+f.round+' · ':''}${tm(f)}${f.comp&&f.comp!='Primera FEB'?E(f.comp)+' · ':''}${f.home?'En casa':'Fuera'}</div></div></div>${f.ptsFor!=null?`<div class="sc">${f.ptsFor}-${f.ptsAgainst}<br><span class="b ${R(f)}">${R(f)=='W'?'V':'D'}</span></div>`:`<span class="sub">${new Date(f.date)<new Date()?'Sin resultado':'Pendiente'}</span>`}</div>`).join('')}</div>`).join('')},
tab(){if(!D.standings.length)return empty('🏆','Sincronizando la clasificación…')+'<div class="sk"></div>';const hp=D.standings.some(s=>s.pf);
 return`<h2 class="it">Clasificación</h2><div class="card wrap"><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>V</th><th>D</th>${hp?'<th>PF</th><th>PC</th>':''}<th>Pts</th></tr>${D.standings.map(s=>`<tr class="${/estudiantes/i.test(s.team)?'me':''}"><td>${s.pos}</td><td>${crest(s.team,26)}${E(s.team)}</td><td>${s.pj}</td><td>${s.w}</td><td>${s.l}</td>${hp?`<td>${s.pf}</td><td>${s.pc}</td>`:''}<td><b>${s.pts??s.w*2}</b></td></tr>`).join('')}</table></div>`},
plan(){const pos=['Todos',...new Set(D.roster.map(p=>p.pos))],l=D.roster.filter(p=>flt=='Todos'||p.pos==flt);
 return`<h2 class="it">Plantilla<em>${cmp?'Elige 2 jugadores':'Toca una carta'}</em></h2><div class="filters"><button class="${cmp?'on':''}" onclick="cmp=!cmp;sel=[];draw()">⚔ Comparar</button>${pos.map(x=>`<button class="${x==flt?'on':''}" onclick="flt='${x}';draw()">${x}</button>`).join('')}</div><div class="pg">${l.map(pcard).join('')}</div>
 <h2 class="it">Cuerpo técnico</h2><div class="card">${D.staff.map(s=>`<div class="row" style="cursor:default"><b>${E(s[0])}</b><span class="sub">${E(s[1])}</span></div>`).join('')}</div>`},
not(){return`<h2 class="it">Noticias</h2>`+(N.length?`<div class="card">${N.map(n=>`<a class="nw" href="${E(n.link)}" target="_blank" rel="noopener"><b>${E(n.title)}</b><div class="sub">${E(n.source)} · ${n.date?new Date(n.date).toLocaleDateString('es-ES'):''}</div></a>`).join('')}</div>`:'<div class="sk"></div><div class="sk"></div>')}};
const show=h=>{$('#sh').innerHTML=h;$('#mod').classList.add('on');setTimeout(()=>{document.querySelectorAll('#sh .br u').forEach(u=>u.style.width=u.dataset.w+'%')},30)};
function pick(n){if(!cmp)return open_(n);sel=sel.includes(n)?sel.filter(x=>x!=n):[...sel,n].slice(-2);if(sel.length==2)vs();else draw()}
function radar(p){const a=Object.entries(at(p)),R0=70,pt=(i,v)=>{const t=-Math.PI/2+i*2*Math.PI/5,r=R0*((v??40)/100);return[90+r*Math.cos(t),90+r*Math.sin(t)].map(x=>x.toFixed(1)).join(',')};return`<svg viewBox="0 0 180 180" width="170">${[.4,.7,1].map(k=>`<polygon fill="none" stroke="#ffffff22" points="${a.map((_,i)=>pt(i,k*100)).join(' ')}"/>`).join('')}<polygon fill="#ffc23366" stroke="#ffc233" stroke-width="2" points="${a.map(([_,v],i)=>pt(i,v)).join(' ')}"/>${a.map(([k],i)=>{const[x,y]=pt(i,118).split(',');return`<text x="${x}" y="${y}" fill="#8793b8" font-size="10" font-weight="700" text-anchor="middle">${k}</text>`}).join('')}</svg>`}
function open_(n){const p=D.roster.find(x=>x.num==n),o=ovr(p),a=at(p),rs=[...new Set(done().map(f=>f.round))].filter(Boolean).sort((x,y)=>x-y),mx=Math.max(...Object.values(p.log||{0:1}),1);
 const S=[['PPG',F(p.ppg)],['RPG',F(p.rpg)],['APG',F(p.apg)],['SPG',F(p.spg)],['BPG',F(p.bpg)],['MIN',F(p.min)],['FG%',P(p.fg)],['3P%',P(p.tp)],['FT%',P(p.ft)],['TS%',P(p.ts)],['USG%',p.usg!=null?F(p.usg)+'%':'—'],['PER',F(p.per)],['ORtg',F(p.ortg)],['DRtg',F(p.drtg)],['VAL',F(p.val)],['PJ',p.gp??'—']].filter(x=>x[1]!='—');
 show(`<div class="big"><div class="pcard ${tier(o)}" style="all:unset"><div class="ov ${tier(o)}" style="--c:${{g:'#ffc233',p:'#a855f7',b:'#2a8bff',s:'#8fa0c8'}[tier(o)]}">${o??'--'}<small>OVR</small></div></div>${img(p)}<div class="nn"><div class="sub">#${p.num} · ${p.pos}</div><h3 class="it">${E(p.name)}</h3></div></div>
 <div class="in"><div class="chips"><span class="chip">${p.height.toFixed(2)} m</span><span class="chip">${age(p.born)} años</span><span class="chip">${E(p.status)}</span></div>
 <div style="display:flex;align-items:center;gap:6px">${radar(p)}<div style="flex:1">${Object.entries(a).map(([k,v])=>`<div class="br"><div><span>${k}</span><b>${v??'—'}</b></div><i><u data-w="${v??0}"></u></i></div>`).join('')}</div></div>
 ${S.length?`<h2 class="it">Estadísticas 2026-27</h2><div class="kp" style="grid-template-columns:repeat(4,1fr)">${S.map(([k,v])=>`<div><b style="font-size:17px">${v}</b><span>${k}</span></div>`).join('')}</div>`:''}
 ${p.log?`<h2 class="it">Puntos por jornada</h2><div class="glg">${rs.map(r=>`<div><b>${p.log[r]??'–'}</b><u style="height:${(p.log[r]||0)/mx*70}px"></u>J${r}</div>`).join('')}</div>`:''}
 ${(p.hl||[]).length?`<h2 class="it">Mejores actuaciones</h2><div class="card">${p.hl.map(h=>`<div class="row" style="cursor:default">${E(h)}</div>`).join('')}</div>`:''}</div>`)}
function vs(){const[A,B]=sel.map(n=>D.roster.find(x=>x.num==n)),M=[['OVR',ovr],['PPG',p=>p.ppg],['RPG',p=>p.rpg],['APG',p=>p.apg],['SPG',p=>p.spg],['Altura',p=>p.height],['Edad',p=>age(p.born)],['Valoración',p=>p.val]];
 show(`<div style="height:18px"></div><div class="cmp"><div>${img(A)}<b class="it">${E(A.name.split(' ').pop())}</b></div><div class="it" style="font-size:24px;color:var(--ac)">VS</div><div>${img(B)}<b class="it">${E(B.name.split(' ').pop())}</b></div></div><div style="height:10px"></div>${M.map(([k,f])=>{const a=f(A),b=f(B);return`<div class="cr2"><div class="a ${a>b?'win':''}">${a==null?'—':F(a,k=='OVR'||k=='Edad'?0:k=='Altura'?2:1)}</div><div class="sub">${k}</div><div class="c ${b>a?'win':''}">${b==null?'—':F(b,k=='OVR'||k=='Edad'?0:k=='Altura'?2:1)}</div></div>`}).join('')}`);sel=[];cmp=false;draw()}
function game(i){const f=D.fixtures[i],pl=D.roster.filter(p=>f.round&&(p.log||{})[f.round]!=null).sort((a,b)=>b.log[f.round]-a.log[f.round]);
 show(`<div class="hero" style="margin:14px">${match(f,64)}${f.note?`<div class="sub" style="text-align:center;margin-top:10px;color:#d6e2ff">${E(f.note)}</div>`:''}</div><div class="in">${f.top?`<div class="card">⭐ ${E(f.top)}</div>`:''}${pl.length?`<h2 class="it">Puntos por jugador</h2><div class="card">${pl.map(p=>`<div class="row" onclick="open_(${p.num})"><div class="l">${face(p)}<div><b>${E(p.name)}</b><div class="sub">${p.gl&&p.gl[f.round]?`${p.gl[f.round].reb} reb · ${p.gl[f.round].ast} ast`:'#'+p.num}</div></div></div><b class="it" style="font-size:20px">${p.log[f.round]}</b></div>`).join('')}</div>`:''}</div>`)}
function lead(){const C=[['val','Valoración'],['ppg','Puntos'],['rpg','Rebotes'],['apg','Asistencias'],['spg','Robos'],['bpg','Tapones']];show(`<div class="in"><h2 class="it" style="margin-top:20px">Líderes del equipo</h2>${C.map(([k,t])=>{const l=D.roster.filter(p=>p[k]!=null).sort((a,b)=>b[k]-a[k]).slice(0,3);return l.length?`<div class="card"><div class="sub it">${t}</div>${l.map(p=>`<div class="row" onclick="open_(${p.num})"><div class="l">${face(p)}<b>${E(p.name)}</b></div><b class="it" style="font-size:20px">${F(p[k])}</b></div>`).join('')}</div>`:''}).join('')}</div>`)}
const go=t=>{tab=t;location.hash=t;$('#mod').classList.remove('on');draw();scrollTo(0,0)},ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'ahora':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`};
function draw(){$('#lg').innerHTML=crest(ME,28);$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');$('#m').innerHTML=V[tab]();
 const s=D.sync,t=[s&&s.lastSync,s&&s.stats&&s.stats.lastSync,s&&s.rg&&s.rg.lastSync].filter(Boolean).sort().pop();$('#sy').textContent=t?'Datos '+ago(t):'Sin sincronizar';$('#dot').className='dot'+(s&&(s.ok||s.stats&&s.stats.ok||s.rg&&s.rg.ok)?'':' x');
 document.querySelectorAll('[data-cu]').forEach(e=>{const to=+e.dataset.cu;let i=0;const t=setInterval(()=>{e.textContent=Math.round(to*(++i/20));if(i>=20)clearInterval(t)},30)});const tl=$('#tl'),nn=tl&&tl.querySelector('.N')||tl&&[...tl.querySelectorAll('.nd')].pop();if(tl&&nn)tl.scrollLeft=nn.offsetLeft-tl.clientWidth/2+39}
async function load(){try{D=await (await fetch('/api/data')).json();draw()}catch(e){}}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(!c||e.pointerType=='mouse'&&!e.buttons&&0)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(600px) rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(c)c.style.transform=''});document.addEventListener('pointerup',e=>{document.querySelectorAll('.pcard').forEach(c=>c.style.transform='')});
(async()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]==h))tab=h;await load();try{N=await (await fetch('/api/news')).json();if(tab=='not')draw()}catch(e){}setInterval(load,6e4);setInterval(()=>{const n=D&&next();if(n&&$('#cd'))$('#cd').outerHTML=cdown(n)},1000)})();
</script></body></html>
