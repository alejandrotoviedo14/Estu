<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#002c72">
<title>Movistar Estudiantes · 2026-27</title>
<style>
:root{color-scheme:dark;--bg:#050b1a;--c1:#0d1830;--c2:#14234a;--ac:#ffc233;--tx:#eef2fb;--mu:#8a9bc0;--bd:#22345e;--w:#2ecc71;--l:#ff5c6c;--bl:#2a63ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(900px 500px at 50% -8%,#1a46c955,transparent),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}

.logo{display:flex;align-items:center;gap:8px;font-weight:800}.logo b{color:var(--ac)}.pill{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--w);box-shadow:0 0 8px var(--w)}.dot.x{background:var(--ac);box-shadow:0 0 8px var(--ac)}
main{max-width:860px;margin:auto;padding:12px 16px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:22px 2px 8px;display:flex;justify-content:space-between}.sub{color:var(--mu);font-size:13px}
.cr{object-fit:contain;filter:drop-shadow(0 3px 8px #0008)}.cr0{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c2);border:1px solid var(--bd);font-weight:800;font-size:13px}
.mc{border-radius:22px;padding:18px 14px;background:linear-gradient(145deg,#0a2a78,#1a46c9 60%,#0b1f55);border:1px solid #3a63d8;position:relative;overflow:hidden}.mc:after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(#ffc23355,transparent 70%)}
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;position:relative;z-index:1}.tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}.mid b{display:block;font-size:30px;letter-spacing:.04em}.mid small{display:block;color:#cfe0ff;font-size:11px}
.cd{display:flex;gap:8px;justify-content:center;margin-top:14px;position:relative;z-index:1}.cd div{background:#00000045;border-radius:12px;padding:7px 0;min-width:56px;text-align:center}.cd b{display:block;font-size:20px}.cd span{font-size:10px;color:#cfe0ff;text-transform:uppercase}
.card{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kp{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:12px}.kp b{font-size:26px;display:block}.kp span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.l{display:flex;align-items:center;gap:12px;min-width:0}.l b{display:block}
.b{display:inline-block;min-width:24px;text-align:center;border-radius:7px;padding:1px 7px;font-weight:800;color:#06101f}.W{background:var(--w)}.L{background:var(--l)}.sc{font-size:20px;font-weight:800;text-align:right}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}.lc{min-width:220px;scroll-snap-align:start;background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--bd);border-radius:18px;padding:12px}.lc .t{font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
.fc{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;background:var(--c2);flex:none}.fc0{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c2);font-weight:800;flex:none}.lv{margin-left:auto;font-weight:800;font-size:17px}
.dt{width:44px;text-align:center;background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:3px 0;font-size:11px;color:var(--mu);flex:none}.dt b{font-size:17px;color:var(--tx)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.filters button{border:1px solid var(--bd);background:var(--c1);color:var(--mu);border-radius:99px;padding:7px 13px;white-space:nowrap;font:inherit}.filters button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:620px){.pg{grid-template-columns:repeat(3,1fr)}}
.pc{border-radius:18px;overflow:hidden;background:var(--c1);border:1px solid var(--bd);position:relative;cursor:pointer}.pc:active{transform:scale(.97)}.pw{position:relative}.pw:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#0d1830)}
.ph{aspect-ratio:3/4;width:100%;object-fit:cover;object-position:top;display:block;background:linear-gradient(160deg,#1a46c9,#0b1f55)}.ini{aspect-ratio:3/4;display:grid;place-items:center;font-size:44px;font-weight:800;background:linear-gradient(160deg,#1a46c9,#0b1f55)}
.num{position:absolute;top:4px;left:10px;font-size:36px;font-weight:900;text-shadow:0 2px 12px #000;z-index:2}.tag{position:absolute;top:10px;right:8px;font-size:10px;padding:2px 8px;border-radius:99px;background:#000a;color:var(--ac);font-weight:700;z-index:2}
.pi{padding:0 12px 12px;margin-top:-34px;position:relative;z-index:2}.pi b{display:block}.pi span{font-size:12px;color:var(--mu)}.chips{display:flex;gap:6px;margin-top:6px}.chip{font-size:11px;background:#ffffff14;border-radius:8px;padding:2px 7px}.chip b{display:inline;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:11px;text-transform:uppercase}th:nth-child(2),td:nth-child(2){text-align:left}td:nth-child(2){display:flex;align-items:center;gap:8px}tr.me{background:#ffc23322;font-weight:700}.wrap{overflow-x:auto}
.mod{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:flex-end}.mod.on{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:var(--c1);border-radius:24px 24px 0 0;border:1px solid var(--bd);max-height:90vh;overflow:auto;padding-bottom:30px}.sheet .ph,.sheet .ini{aspect-ratio:4/3;object-position:top}.in{padding:14px 18px}.in h3{margin:0;font-size:24px}
.br{margin:10px 0}.br div{display:flex;justify-content:space-between;font-size:13px}.br i{display:block;height:8px;border-radius:99px;background:#ffffff14;margin-top:4px;overflow:hidden}.br i u{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--ac));border-radius:99px}
.lg{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}.lg div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.lg u{display:block;background:var(--bl);border-radius:6px 6px 0 0;min-height:3px;text-decoration:none}.lg b{color:var(--tx);font-size:12px}
.sk{height:64px;border-radius:14px;margin:10px 0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200%;animation:s 1.3s infinite}@keyframes s{to{background-position:-200%}}.empty{text-align:center;color:var(--mu);padding:18px}.empty big{font-size:34px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#050b1ae8;backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
a{color:#7fa4ff;text-decoration:none}.nw{display:block;padding:12px 0;border-bottom:1px solid var(--bd);color:var(--tx)}.nw:last-child{border:0}
</style></head><body>
<header><div class="logo"><span id="lg"></span>MOVISTAR <b>ESTUDIANTES</b></div><div class="pill"><span class="dot x" id="dot"></span><span id="sy">…</span></div></header>
<main id="m"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<div class="mod" id="mod" onclick="if(event.target==this)this.classList.remove('on')"><div class="sheet" id="sh"></div></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['ini','🏠','Inicio'],['par','📅','Partidos'],['tab','🏆','Tabla'],['plan','👕','Plantilla'],['not','📰','Noticias']];
const PH='https://www.movistarestudiantes.com/wp-content/uploads/2026/10/Jugadores-web-Primera-FEB-';
const CR=[['palmer',22911],['alicante',6350],['estela',71613],['gran canaria',212],['ourense',14053],['oviedo',14049],['albacete',72119],['granada',215],['estudiantes',220],['gipuzkoa',7811],['palma',91233],['palencia',14046],['tizona',67290],['burgos',67290],['fuenlabrada',218],['menorca',76830],['zamora',71531],['rdoba',98201],['caja 87',98200]];
let D,N=[],tab='ini',flt='Todos';
const ini=n=>String(n).split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),age=b=>Math.floor((Date.now()-new Date(b))/315576e5);
const crest=(n,s=40)=>{const k=String(n).toLowerCase(),c=CR.find(x=>k.includes(x[0])),i=ini(n);return c?`<img class="cr" width="${s}" height="${s}" loading="lazy" src="https://imagecache.365scores.com/image/upload/f_png,w_${s*2},h_${s*2},c_limit,q_auto:eco,d_Competitors:default1.png/v1/Competitors/${c[1]}" alt="${i}" onerror="this.outerHTML='<span class=cr0>${i}</span>'">`:`<span class="cr0">${i}</span>`};
const face=p=>`<img class="fc" loading="lazy" src="${PH}${p.ph}.jpg" alt="${ini(p.name)}" onerror="this.outerHTML='<span class=fc0>${ini(p.name)}</span>'">`;
const img=p=>`<img class="ph" loading="lazy" src="${PH}${p.ph}.jpg" alt="${ini(p.name)}" onerror="this.outerHTML='<div class=ini>${ini(p.name)}</div>'">`;
const fd=d=>new Date(d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}),ft=d=>new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),tm=f=>f.noTime?'':ft(f.date)+' · ';
const done=()=>D.fixtures.filter(f=>f.ptsFor!=null).sort((a,b)=>new Date(a.date)-new Date(b.date)),next=()=>D.fixtures.filter(f=>f.ptsFor==null&&new Date(f.date)>new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
const R=f=>f.ptsFor>f.ptsAgainst?'W':'L',avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,empty=(i,t)=>`<div class="card empty"><big>${i}</big>${t}</div>`;
const ME='Movistar Estudiantes';
function match(f,big){const A=f.home?[ME,f.rival]:[f.rival,ME],sc=f.ptsFor!=null?(f.home?[f.ptsFor,f.ptsAgainst]:[f.ptsAgainst,f.ptsFor]):null;
 return`<div class="mt"><div class="tm">${crest(A[0],big?60:48)}${E(A[0])}</div><div class="mid">${sc?`<b>${sc[0]}-${sc[1]}</b>`:'<b>VS</b>'}<small>${E(f.comp||'')}${f.round?' · J'+f.round:''}</small><small>${fd(f.date)} ${f.noTime?'':ft(f.date)}</small></div><div class="tm">${crest(A[1],big?60:48)}${E(A[1])}</div></div>`}
function cdown(n){if(!n)return'';let r=Math.max(0,(new Date(n.date)-Date.now())/1e3);return`<div class="cd" id="cd">${[['días',86400],['h',3600],['min',60],['s',1]].map(([l,k])=>{const v=Math.floor(r/k);r-=v*k;return`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`}).join('')}</div>`}
function leaders(){const C=[['val','Valoración'],['ppg','Puntos'],['rpg','Rebotes'],['apg','Asistencias']];return C.map(([k,t])=>{const l=D.roster.filter(p=>p[k]!=null).sort((a,b)=>b[k]-a[k]).slice(0,3);return l.length?`<div class="lc"><div class="t">${t}</div>${l.map(p=>`<div class="row" onclick="open_(${p.num})" style="padding:7px 0"><div class="l">${face(p)}<div><b>${E(p.name.split(' ').pop())}</b><span class="sub">#${p.num}</span></div></div><span class="lv">${p[k]}</span></div>`).join('')}</div>`:''}).join('')}
const V={
ini(){const p=done(),w=p.filter(f=>R(f)=='W').length,st=D.standings.find(s=>/estudiantes/i.test(s.team)),n=next(),last=p[p.length-1];
 return`<div class="mc">${n?`<div class="sub" style="text-align:center;color:#cfe0ff;margin-bottom:8px;position:relative;z-index:1">PRÓXIMO PARTIDO</div>${match(n,1)}${cdown(n)}`:'<div class="sub">Sin próximo partido</div>'}</div>
 ${last?`<h2>Último resultado</h2><div class="card">${match(last)}${last.top?`<div class="sub" style="text-align:center;margin-top:8px">⭐ ${E(last.top)}</div>`:''}</div>`:''}
 <h2>Temporada ${D.season}</h2><div class="grid"><div class="kp"><b>${p.length?w+'-'+(p.length-w):'—'}</b><span>Balance</span></div><div class="kp"><b>${st?st.pos+'º':'—'}</b><span>Clasificación</span></div><div class="kp"><b>${p.length?avg(p.map(f=>f.ptsFor)).toFixed(1):'—'}</b><span>Puntos a favor</span></div><div class="kp"><b>${p.length?avg(p.map(f=>f.ptsAgainst)).toFixed(1):'—'}</b><span>Puntos en contra</span></div></div>
 ${p.length?`<div class="card"><div class="sub">Últimos partidos</div><div style="margin:8px 0">${p.slice(-8).map(f=>`<span class="b ${R(f)}">${R(f)=='W'?'V':'D'}</span>`).join(' ')}</div></div>`:''}
 <h2>Líderes del equipo</h2><div class="hs">${leaders()||''}</div>
 <h2>Plantilla en datos</h2><div class="grid"><div class="kp"><b>${D.roster.length}</b><span>Jugadores</span></div><div class="kp"><b>${avg(D.roster.map(x=>age(x.born))).toFixed(1)}</b><span>Edad media</span></div><div class="kp"><b>${avg(D.roster.map(x=>x.height)).toFixed(2)} m</b><span>Altura media</span></div><div class="kp"><b>${D.roster.filter(x=>/local/i.test(x.status)).length}</b><span>Formados localmente</span></div></div>
 <h2>Club</h2>${D.teams.map(t=>`<div class="card row"><div><b>${E(t.name)}</b><div class="sub">${E(t.note)}</div></div><div class="sub" style="text-align:right">${E(t.league)}<br>${E(t.coach)}</div></div>`).join('')}
 <h2>Contexto</h2><div class="card">${D.history.map(h=>`<div class="row"><span>🏆 ${E(h)}</span></div>`).join('')}</div>`},
par(){if(!D.fixtures.length)return empty('📅','Calendario pendiente de sincronizar.');const g={};[...D.fixtures].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(f=>{const k=new Date(f.date).toLocaleDateString('es-ES',{month:'long',year:'numeric'});(g[k]=g[k]||[]).push(f)});
 return Object.entries(g).map(([k,a])=>`<h2>${k}</h2><div class="card">${a.map(f=>`<div class="row"><div class="l"><div class="dt"><b>${new Date(f.date).getDate()}</b>${new Date(f.date).toLocaleDateString('es-ES',{weekday:'short'})}</div>${crest(f.rival,38)}<div style="min-width:0"><b>${f.home?'vs':'@'} ${E(f.rival)}</b><div class="sub">${f.round?'J'+f.round+' · ':''}${tm(f)}${f.comp&&f.comp!='Primera FEB'?E(f.comp)+' · ':''}${f.home?'En casa':'Fuera'}</div>${f.top?`<div class="sub">⭐ ${E(f.top)}</div>`:''}${f.note?`<div class="sub">${E(f.note)}</div>`:''}</div></div>${f.ptsFor!=null?`<div class="sc">${f.ptsFor}-${f.ptsAgainst}<br><span class="b ${R(f)}">${R(f)=='W'?'V':'D'}</span></div>`:`<span class="sub">${new Date(f.date)<new Date()?'Sin resultado':'Pendiente'}</span>`}</div>`).join('')}</div>`).join('')},
tab(){if(!D.standings.length)return empty('🏆','Sincronizando la clasificación…')+'<div class="sk"></div>';const hp=D.standings.some(s=>s.pf);
 return`<div class="card wrap"><table><tr><th>#</th><th>Equipo</th><th>PJ</th><th>V</th><th>D</th>${hp?'<th>PF</th><th>PC</th>':''}<th>Pts</th></tr>${D.standings.map(s=>`<tr class="${/estudiantes/i.test(s.team)?'me':''}"><td>${s.pos}</td><td>${crest(s.team,24)}${E(s.team)}</td><td>${s.pj}</td><td>${s.w}</td><td>${s.l}</td>${hp?`<td>${s.pf}</td><td>${s.pc}</td>`:''}<td><b>${s.pts??s.w*2}</b></td></tr>`).join('')}</table></div>`},
plan(){const pos=['Todos',...new Set(D.roster.map(p=>p.pos))],l=D.roster.filter(p=>flt=='Todos'||p.pos==flt);
 return`<div class="filters">${pos.map(x=>`<button class="${x==flt?'on':''}" onclick="flt='${x}';draw()">${x}</button>`).join('')}</div><div class="pg">${l.map(p=>`<div class="pc" onclick="open_(${p.num})"><span class="num">${p.num}</span>${/extra|cotonú/i.test(p.status)?`<span class="tag">${/extra/i.test(p.status)?'EXTRA':'COT'}</span>`:''}<div class="pw">${img(p)}</div><div class="pi"><b>${E(p.name)}</b><span>${p.pos} · ${p.height.toFixed(2)} m · ${age(p.born)} años</span>${p.ppg!=null||p.rpg!=null||p.apg!=null?`<div class="chips">${p.ppg!=null?`<span class="chip"><b>${p.ppg}</b> PTS</span>`:''}${p.rpg!=null?`<span class="chip"><b>${p.rpg}</b> REB</span>`:''}${p.apg!=null?`<span class="chip"><b>${p.apg}</b> AST</span>`:''}</div>`:''}</div></div>`).join('')}</div>
 <h2>Cuerpo técnico</h2><div class="card">${D.staff.map(s=>`<div class="row"><b>${E(s[0])}</b><span class="sub">${E(s[1])}</span></div>`).join('')}</div>`},
not(){return N.length?`<div class="card">${N.map(n=>`<a class="nw" href="${E(n.link)}" target="_blank" rel="noopener"><b>${E(n.title)}</b><div class="sub">${E(n.source)} · ${n.date?new Date(n.date).toLocaleDateString('es-ES'):''}</div></a>`).join('')}</div>`:'<div class="sk"></div><div class="sk"></div><div class="sk"></div>'}};
function open_(n){const p=D.roster.find(x=>x.num==n),M=[['val','Valoración'],['ppg','Puntos'],['rpg','Rebotes'],['apg','Asistencias']].filter(x=>p[x[0]]!=null),rs=[...new Set(done().map(f=>f.round))].filter(Boolean).sort((a,b)=>a-b),mx=Math.max(...Object.values(p.log||{0:1}),1);
 $('#sh').innerHTML=img(p)+`<div class="in"><div class="sub">#${p.num} · ${p.pos}</div><h3>${E(p.name)}</h3><div class="grid" style="margin-top:12px"><div class="kp"><b>${p.height.toFixed(2)} m</b><span>Altura</span></div><div class="kp"><b>${age(p.born)}</b><span>Años · ${E(p.status)}</span></div></div>
 ${M.length?`<h2>Estadísticas 2026-27</h2>${M.map(([k,t])=>{const m=Math.max(...D.roster.map(x=>x[k]||0));return`<div class="br"><div><span>${t}</span><b>${p[k]}</b></div><i><u style="width:${p[k]/m*100}%"></u></i></div>`}).join('')}`:''}
 ${p.log?`<h2>Puntos por jornada</h2><div class="lg">${rs.map(r=>`<div><b>${p.log[r]??'–'}</b><u style="height:${(p.log[r]||0)/mx*70}px"></u>J${r}</div>`).join('')}</div>`:''}
 ${(p.hl||[]).length?`<h2>Mejores actuaciones</h2><div class="card">${p.hl.map(h=>`<div class="row"><span>${E(h)}</span></div>`).join('')}</div>`:''}</div>`;$('#mod').classList.add('on')}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'ahora':m<60?`hace ${m} min`:`hace ${Math.round(m/60)} h`};
