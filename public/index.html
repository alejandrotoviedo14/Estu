 ${gl.length?`<h2 class="it">Registro por partido</h2><div class="card wrap"><table class="box"><tr><th>J</th><th>Rival</th><th>Res</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>VAL</th></tr>${gl.map(([r,g])=>`<tr><td>${r}</td><td>${g.home?'vs':'@'} ${E(g.rival)}</td><td>${E(g.res)}</td><td>${F(g.min,0)}</td><td><b>${g.pts}</b></td><td>${g.reb}</td><td>${g.ast}</td><td>${F(g.val,0)}</td></tr>`).join('')}</table></div>`:''}
 ${(p.hl||[]).length?`<h2 class="it">Mejores actuaciones</h2><div class="card">${p.hl.map(h=>`<div class="row" style="cursor:default">${E(h)}</div>`).join('')}</div>`:''}</div>`)}
function vs(){const[A,B]=sel.map(n=>D.roster.find(x=>x.num==n)),M=[['OVR',ovr],['PPG',p=>p.ppg],['RPG',p=>p.rpg],['APG',p=>p.apg],['SPG',p=>p.spg],['Altura',p=>p.height],['Edad',p=>age(p.born)],['Valoración',p=>p.val]];
 show(`<div style="height:18px"></div><div class="cmp"><div>${img(A)}<b class="it">${E(A.name.split(' ').pop())}</b></div><div class="it" style="font-size:24px;color:var(--ac)">VS</div><div>${img(B)}<b class="it">${E(B.name.split(' ').pop())}</b></div></div><div style="height:10px"></div>${M.map(([k,f])=>{const a=f(A),b=f(B);return`<div class="cr2"><div class="a ${a>b?'win':''}">${a==null?'—':F(a,k=='OVR'||k=='Edad'?0:k=='Altura'?2:1)}</div><div class="sub">${k}</div><div class="c ${b>a?'win':''}">${b==null?'—':F(b,k=='OVR'||k=='Edad'?0:k=='Altura'?2:1)}</div></div>`}).join('')}`);sel=[];cmp=false;draw()}
function game(i){const f=D.fixtures[i];if(!f)return;const pl=D.roster.filter(p=>f.round&&(p.log||{})[f.round]!=null).sort((a,b)=>b.log[f.round]-a.log[f.round]);
 show(`<div class="hero" style="margin:14px">${match(f,64)}${f.venue?`<div class="sub" style="text-align:center;margin-top:10px;color:#d6e2ff">📍 ${E(f.venue)}</div>`:''}<div style="text-align:center;margin-top:12px"><a class="btn g" href="/calendario/partido/${E(f.id)}.ics">📅 Añadir al calendario</a></div></div><div class="in" id="gbox">${pl.length?`<h2 class="it">Puntos por jugador</h2><div class="card">${pl.map(p=>`<div class="row" role="button" tabindex="0" onclick="open_(${p.num})"><div class="l">${face(p)}<div><b>${E(p.name)}</b><div class="sub">${p.gl&&p.gl[f.round]?`${p.gl[f.round].reb} reb · ${p.gl[f.round].ast} ast`:'#'+p.num}</div></div></div><b class="it" style="font-size:20px">${p.log[f.round]}</b></div>`).join('')}</div>`:''}<div class="sub" style="margin:12px 0">Cargando estadísticas del partido…</div></div>`);
 if(f.partido)boxFor(f);else{const b=$('#gbox');if(b&&b.lastElementChild)b.lastElementChild.textContent='Estadísticas disponibles tras el partido'}}
async function boxFor(f){const b=$('#gbox');try{const m=await (await fetch('/api/match/'+f.partido)).json();if(!$('#gbox')||!m.played){if(b)b.lastElementChild.textContent='Acta no disponible todavía';return}
 const side=t=>`<h2 class="it">${E(t.name)}<em>${t.pts}</em></h2><div class="card wrap"><table class="box"><tr><th>Jugador</th><th>MIN</th><th>PTS</th><th>T2</th><th>T3</th><th>TL</th><th>REB</th><th>AST</th><th>ROB</th><th>PÉR</th><th>VAL</th></tr>${[...t.players].sort((x,y)=>y.min-x.min).map(p=>`<tr class="${t.id==TEAM_ID?'me':''}"><td>${E(p.name)}</td><td>${F(p.min,0)}</td><td><b>${p.pts}</b></td><td>${p.t2[0]}/${p.t2[1]}</td><td>${p.t3[0]}/${p.t3[1]}</td><td>${p.ft[0]}/${p.ft[1]}</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.tov}</td><td>${p.val}</td></tr>`).join('')}</table></div>`;
 b.lastElementChild.remove();b.insertAdjacentHTML('beforeend',`<h2 class="it">Estadísticas del partido</h2>${m.venue?`<div class="sub">📍 ${E(m.venue)}</div>`:''}${side(m.home)}${side(m.away)}`)}catch(e){if(b&&b.lastElementChild)b.lastElementChild.textContent='No se pudo cargar el acta: '+e.message}}
function lead(){const C=[['val','Valoración'],['ppg','Puntos'],['rpg','Rebotes'],['apg','Asistencias'],['spg','Robos'],['bpg','Tapones']];show(`<div class="in"><h2 class="it" style="margin-top:20px">Líderes del equipo</h2>${C.map(([k,t])=>{const l=D.roster.filter(p=>p[k]!=null).sort((a,b)=>b[k]-a[k]).slice(0,3);return l.length?`<div class="card"><div class="sub it">${t}</div>${l.map(p=>`<div class="row" role="button" tabindex="0" onclick="open_(${p.num})"><div class="l">${face(p)}<b>${E(p.name)}</b></div><b class="it" style="font-size:20px">${F(p[k])}</b></div>`).join('')}</div>`:''}).join('')}</div>`)}
// Ficha de un rival: clasificación, resultados de la temporada y partidos contra Estudiantes
function rival(id){const t=(D.rivals||[]).find(x=>x.id==id);if(!t)return;const s=t.standing||{},vs=t.results.find(r=>r.vsUs),nx=t.results.find(r=>!r.res);
 const pj=s.pj||t.results.filter(r=>r.res).length;
 show(`<div class="in"><h2 class="it" style="margin-top:20px">${crest(t.name,64)} <span>${E(t.name)}</span></h2>
 <div class="kp"><div><b>${s.pos??'—'}º</b><span>Posición</span></div><div><b>${s.w??0}-${s.l??0}</b><span>V-D</span></div><div><b>${pj&&s.pf!=null?F(s.pf/pj,1):'—'}</b><span>Anota</span></div><div><b>${pj&&s.pc!=null?F(s.pc/pj,1):'—'}</b><span>Recibe</span></div></div>
 ${nx?`<h2 class="it">Próximo partido</h2><div class="card">J${nx.round} · ${nx.home?'En casa':'Fuera'} · vs ${E(nx.rival)}</div>`:''}
 ${vs?`<h2 class="it">Contra Movistar Estudiantes</h2><div class="card"><b>J${vs.round}</b> · ${vs.res?`${vs.res[0]}-${vs.res[1]} <span class="b ${vs.res[0]>vs.res[1]?'W':'L'}">${vs.res[0]>vs.res[1]?'V':'D'}</span>`:'Pendiente'}</div>`:''}
 <h2 class="it">Resultados<em>${t.results.filter(r=>r.res).length} jugados</em></h2><div class="card">${t.results.map(r=>`<div class="row" style="cursor:default"><div><b>J${r.round} · ${r.home?'vs':'@'} ${E(r.rival)}</b>${r.vsUs?'<div class="sub">Partido contra Estudiantes</div>':''}</div><b>${r.res?`${r.res[0]}-${r.res[1]} <span class="b ${r.res[0]>r.res[1]?'W':'L'}">${r.res[0]>r.res[1]?'V':'D'}</span>`:'<span class="sub">—</span>'}</b></div>`).join('')}</div></div>`)}
function status(){const s=D.sync||{},c=s.counts||{},rows=[['Datos de la FEB (calendario, resultados, clasificación, plantilla y actas)',s.lastSync,s.ok,s.errors||[],`${c.played||0}/${c.fixtures||0} partidos jugados · ${c.actas||0} actas · ${c.roster||0} jugadores`],['Agenda del club (Google Calendar)',s.agendaSync,!!s.agendaSync,[],`${c.agenda||0} eventos`]];
 show(`<div class="in"><h2 class="it" style="margin-top:20px">Estado de los datos</h2>${rows.map(r=>`<div class="card"><b>${r[2]?'🟢':'🔴'} ${r[0]}</b><div class="sub">${r[1]?'Última sincronización '+agoT(r[1]):'Nunca se ha sincronizado'}${r[4]?' · '+r[4]:''}</div>${r[3].map(e=>`<div class="sub" style="color:var(--l);word-break:break-all">${E(e)}</div>`).join('')}</div>`).join('')}<button class="btn" onclick="forzar(this)">Forzar sincronización</button></div>`)}
async function forzar(b){b.textContent='Sincronizando…';const x=await fetch('/api/sync').catch(()=>null);if(x&&x.status===429){const j=await x.json().catch(()=>({}));b.textContent='Espera '+(j.retryAfter||60)+' s';return}await load();status()}
const go=t=>{tab=t;fresh=true;location.hash=t;closeM();draw();scrollTo(0,0)};
function draw(){$('#lg').innerHTML=crest(ME,28);$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k==tab?'on':''}"${k==tab?' aria-current="page"':''} onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');$('#m').innerHTML=V[tab]();
 const s=D.sync||{};$('#sy').textContent=s.lastSync?'Datos '+agoT(s.lastSync):'Sin sincronizar';$('#dot').className='dot'+(s.ok?'':' x');
 if(fresh)document.querySelectorAll('[data-cu]').forEach(e=>{const to=+e.dataset.cu;let i=0;const t=setInterval(()=>{e.textContent=Math.round(to*(++i/20));if(i>=20)clearInterval(t)},30)});
 const tl=$('#tl'),nn=tl&&tl.querySelector('.N')||tl&&[...tl.querySelectorAll('.nd')].pop();if(tl&&nn&&fresh)tl.scrollLeft=nn.offsetLeft-tl.clientWidth/2+39;fresh=false}
async function load(){try{const r=await fetch('/api/data',{signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error('El servidor respondió HTTP '+r.status);D=await r.json();draw()}catch(e){if(!D)$('#m').innerHTML=`<div class="card empty"><big>⚠️</big>No se pueden cargar los datos<br><span class="sub">${E(e.message)}</span><br><br><button class="btn" onclick="load()">Reintentar</button></div>`}}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM();if((e.key=='Enter'||e.key==' ')&&e.target.getAttribute&&e.target.getAttribute('role')=='button'){e.preventDefault();e.target.click()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]==h)&&h!=tab){tab=h;fresh=true;draw()}});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(!c||e.pointerType=='mouse'&&!e.buttons&&0)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(600px) rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(c)c.style.transform=''});document.addEventListener('pointerup',e=>{document.querySelectorAll('.pcard').forEach(c=>c.style.transform='')});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
(async()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]==h))tab=h;await load();try{N=await (await fetch('/api/news')).json();if(tab=='not')draw()}catch(e){}setInterval(load,6e4);setInterval(()=>{const n=D&&next();if(n&&$('#cd'))$('#cd').outerHTML=cdown(n)},1000)})();
</script></body></html>
